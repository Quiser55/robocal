collector:
  ros__parameters:
    base_frame: base_link
    tool_frame: ee_link
    sample_file: ""  # "" = use $ROS_HOME/annin_ar4_calibration/samples.npy
    tf_lookup_timeout_sec: 1.0
    min_orientation_change_deg: 0.0  # 0 = disabled (opt-in duplicate-capture guard)

calibration:
  ros__parameters:
    base_frame: base_link
    tool_frame: ee_link
    tcp_frame: tcp
    min_samples: 10
    sample_file: ""
    result_file: ""  # "" = use $ROS_HOME/annin_ar4_calibration/tcp_result.yaml
    ransac:
      enabled: true
      threshold: 0.002
      iterations: 100
      min_subset_size: 3

visualization:
  ros__parameters:
    base_frame: base_link
    sample_file: ""
    result_file: ""
    publish_rate_hz: 1.0
