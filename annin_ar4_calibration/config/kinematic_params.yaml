# target_detector is reused as-is from WP3 (hand-eye) - this is WP4's own copy
# of its parameter block so kinematic.launch.py doesn't depend on
# hand_eye_params.yaml at launch time. Keep target_type/target geometry
# consistent with whichever tag is physically mounted for this run.
target_detector:
  ros__parameters:
    image_topic: /camera/camera/color/image_raw
    camera_info_topic: /camera/camera/color/camera_info
    target_type: charuco       # charuco | aruco
    aruco_dictionary: DICT_5X5_250
    charuco.squares_x: 5
    charuco.squares_y: 7
    charuco.square_length_m: 0.035   # measure the actually-printed board - see README
    charuco.marker_length_m: 0.026
    charuco.min_charuco_corners: 6
    aruco.marker_id: 1
    aruco.marker_length_m: 0.05
    target_frame: calibration_target
    publish_debug_image: true

kinematic_collector:
  ros__parameters:
    base_frame: base_link
    tool_frame: ee_link
    camera_optical_frame: camera_color_optical_frame
    target_frame: calibration_target
    sample_file: ""
    tf_lookup_timeout_sec: 1.0
    joint_states_topic: /joint_states
    arm_joint_names: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
    num_candidate_configs: 200   # attempted joint-space configs per run_auto_sequence call
    min_samples: 100             # usable (visible) samples to collect before stopping
    min_joint_range_deg: 30.0    # per-joint observed-range gate - see README notes
    joint_margin_deg: 5.0        # shrink each joint's sampled range away from its hard limits
    settle_time_sec: 0.5

kinematic_calibration:
  ros__parameters:
    base_frame: base_link
    tool_frame: ee_link
    calibration_type: eye_to_hand   # must match the hand_eye_result.yaml this WP4 run depends on
    arm_joint_names: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
    hand_eye_result_file: ""
    sample_file: ""
    result_file: ""
    min_samples: 80
    min_joint_range_deg: 30.0
    method: both            # sequential | joint | both
    ridge_lambda: 1.0e-6
    bounds.translation_m: 0.01
    bounds.rotation_deg: 3.0
    run_lm_diagnostic: true  # also run scipy 'lm' as a secondary, non-unique diagnostic

kinematic_visualization:
  ros__parameters:
    base_frame: base_link
    tool_frame: ee_link
    arm_joint_names: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
    sample_file: ""
    result_file: ""
    hand_eye_result_file: ""
    joint_states_topic: /joint_states
    publish_rate_hz: 1.0
