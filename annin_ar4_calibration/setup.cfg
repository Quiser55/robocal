[develop]
script_dir=$base/lib/annin_ar4_calibration
[install]
install_scripts=$base/lib/annin_ar4_calibration

# Where pytest looks once colcon has chosen it. What *makes* colcon choose it
# is `tests_require=['pytest']` in setup.py - this section alone is not enough.
[tool:pytest]
testpaths = test
python_files = test_*.py
